name: Publish package

on:
#  push:
#    tags:
#      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored when an exact version is provided)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Exact version without build metadata (e.g. 1.2.3 or 1.2.3-beta.1)"
        required: false
        type: string

permissions:
  id-token: write # Required for OIDC authentication
  contents: write # Allows the workflow to read repository contents
concurrency:
  group: npm-release
  cancel-in-progress: false

# see: https://gist.github.com/jaywcjlove/a178278521a6f72c74525d3f1d9c4bf9
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org


      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: yarn install

      - name: Bump version (commit + tag)
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump }}
          EXACT_VERSION: ${{ inputs.version }}
        run: |
          version="$BUMP_TYPE"
          if [[ -n "$EXACT_VERSION" ]]; then
            numeric='(0|[1-9][0-9]*)'
            prerelease_identifier="($numeric|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
            semver="^$numeric\.$numeric\.$numeric(-$prerelease_identifier(\.$prerelease_identifier)*)?$"
            if [[ ! "$EXACT_VERSION" =~ $semver ]]; then
              echo "::error::Exact version must be a semantic version without build metadata, such as 1.2.3 or 1.2.3-beta.1"
              exit 1
            fi
            version="$EXACT_VERSION"
          fi
          npm version "$version" -m "chore(release): %s [skip ci]"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: npm run build

      - name: Push commit and tag
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin --tags

      - name: Publish to npm
        run: NODE_AUTH_TOKEN="" npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
